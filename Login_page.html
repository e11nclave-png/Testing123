<script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.querySelector("form.styles-module-scss-module__irbAkW__root");
  const emailInput = form.querySelector('input[name="email"]');
  const passwordInput = form.querySelector('input[name="password"]');
  const loginButton = form.querySelector('button[type="submit"]');
  const passwordToggleBtn = form.querySelector('button[aria-label="toggle password visibility"]');
  const svgPath = passwordToggleBtn.querySelector("svg path");

  // Classes to toggle for login button enable/disable
  const disabledClass = "styles-module-scss-module__irbAkW__disabledButton";

  function validateInputs() {
    // Check email contains at least one @ symbol
    const emailValid = emailInput.value.includes("@");
    // Check password is at least 7 characters long
    const passwordValid = passwordInput.value.length >= 7;
    return emailValid && passwordValid;
  }

  function updateLoginButton() {
    if (validateInputs()) {
      loginButton.classList.remove(disabledClass);
      loginButton.removeAttribute("disabled");
    } else {
      if (!loginButton.classList.contains(disabledClass)) {
        loginButton.classList.add(disabledClass);
      }
      loginButton.setAttribute("disabled", "true");
    }
  }

  // Event listeners for input changes to trigger activation
  emailInput.addEventListener("input", updateLoginButton);
  passwordInput.addEventListener("input", updateLoginButton);

  // Password visibility toggle state
  let passwordVisible = false;

  passwordToggleBtn.addEventListener("click", (e) => {
    e.preventDefault(); // Prevent form submission on toggle
    passwordVisible = !passwordVisible;
    passwordInput.type = passwordVisible ? "text" : "password";

    if (passwordVisible) {
      svgPath.setAttribute("d", "M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9M12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17M12,4.5C7,4.5 2.73,7.61 1,12C2.73,16.39 7,19.5 12,19.5C17,19.5 21.27,16.39 23,12C21.27,7.61 17,4.5 12,4.5Z");
    } else {
      svgPath.setAttribute("d", "M11.83,9L15,12.16C15,12.11 15,12.05 15,12A3,3 0 0,0 12,9C11.94,9 11.89,9 11.83,9M7.53,9.8L9.08,11.35C9.03,11.56 9,11.77 9,12A3,3 0 0,0 12,15C12.22,15 12.44,14.97 12.65,14.92L14.2,16.47C13.53,16.8 12.79,17 12,17A5,5 0 0,1 7,12C7,11.21 7.2,10.47 7.53,9.8M2,4.27L4.28,6.55L4.73,7C3.08,8.3 1.78,10 1,12C2.73,16.39 7,19.5 12,19.5C13.55,19.5 15.03,19.2 16.38,18.66L16.81,19.08L19.73,22L21,20.73L3.27,3M12,7A5,5 0 0,1 17,12C17,12.64 16.87,13.26 16.64,13.82L19.57,16.75C21.07,15.5 22.27,13.86 23,12C21.27,7.61 17,4.5 12,4.5C10.6,4.5 9.26,4.75 8,5.2L10.17,7.35C10.74,7.13 11.35,7 12,7Z");
    }
  });

  // Redirect logic: only works if validation passes
  loginButton.addEventListener('click', function(event) {
    event.preventDefault();
    if (validateInputs()) {
      window.location.href = 'bedtversion.html';
    }
  });

  // Initialize button state on load
  updateLoginButton();
});
</script>
